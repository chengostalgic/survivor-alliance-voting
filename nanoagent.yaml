_ > nanoagent.plugin.v0001.ManifestConfig:
id: survivor-alliance
name: Survivor Alliance
version: 0.5.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  resolve_tribal:
    description: Resolve standard voting, tied-player-excluded revotes, unanimous decisions or rocks, and explicit final-four voting/fire formats. Missing revotes, rock results, or fire winners produce a pending result; ballot and roster order never choose a loser.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  scenario-outcome:
    description: >-
      DEFAULT for all ordinary Survivor scenarios: who goes home, do I survive,
      does my alliance survive, what happens after these idol/advantage plays?
      The user speaks naturally; construct arguments yourself, never ask for JSON.
      Use council.format null for ordinary tribal voting, including a four-person
      tribe. Use the built-in vote/revote/deadlock rules.
      Supply the roster, alliance, assumed ordinary votes, challenge immunity,
      all actual assumed plays (owner, kind, target), and perspective or null.
      Ownership does not play an idol: Esther's idol played ON JOHN protects John.
      Set revotes: [] and resolution_facts: null when those details are unknown.
      CALL THIS TASK to count. An initial tie automatically requires a revote:
      tied contestants DO NOT vote, and other contestants vote only for those tied.
      The result names the eligible revoters if their ballots are missing.
      If a revote stays tied, the standard format allows a stated unanimous
      decision; otherwise eligible non-tied, non-protected players risk rocks.
      Never ask for an ordered roster, randomly choose a loser, or invent votes.
      A missing rock result is a valid deadlock result with eligible drawers shown.
      If a draw outcome was explicitly assumed, put that name in rock_draw_loser.
      For the final four, distinguish final_four_vote (deadlocked vote goes to
      fire) from final_four_fire (forced-fire format, no votes). Four people at
      an ordinary tribe are NOT automatically the final four. Ask about format
      only when the user's final-four description leaves it ambiguous.
      In forced fire use votes: [], revotes: [], plays: []; record the stated fire
      pair and winner in resolution_facts, or leave them unknown. Missing fire
      participants or winner produces a pending fire result, never a prediction.
      When no extra resolution facts were stated use resolution_facts: null;
      otherwise its fields are consensus_eliminated, rock_draw_loser, fire_participants,
      and fire_winner, with null for unknown names and [] for an unknown pair.
      Report the calculated stage and conditional result, including a correct
      losing result.
    runner: tool
    tools: [resolve_tribal]
    reference: null
    instructions: >-
      Apply only the stated votes and plays. Votes are a multiset: casting or
      listing order never affects tallies or elimination. Do not solve an
      unobserved random draw or challenge. Return complete if one loser follows
      from the assumptions, otherwise the precise pending stage and missing facts.
      Extra votes and vote blocks affect the initial round only in this declared
      variant. Idols last through revotes and rocks. This models the supported
      formats, not every season-specific advantage or vote-loss exception.
