_ > nanoagent.plugin.v0001.ManifestConfig:
id: survivor-alliance
name: Survivor Alliance
version: 0.4.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  evaluate_scenario:
    description: Calculate exactly one assumed council from fixed ordinary votes and explicit idol, extra-vote, and vote-block plays. Ownership alone gives no protection. Return who leaves, personal/alliance survival, and complete tallies; do not optimize or predict actual votes.
  resolve_vote:
    description: Resolve a Survivor-style council from supplied ballots, immunity, and explicit tie rules.
  find_rescue:
    description: Check every legal initial-vote change by one alliance member and find moves that save the whole alliance.
  plan_advantages:
    description: Compare holding items, idols, extra votes, and vote blocks; find minimum-item saving plays and their outcomes.

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  scenario-outcome:
    description: >-
      Default task for "who goes home?", "do I go home?", or "does our alliance survive?"
      Evaluate the user's guessed or hypothetical council assuming every supplied vote
      and item play happens exactly as stated. Accept ordinary prose; never ask for JSON.
      Extract the complete roster, alliance, one ordinary vote per person, challenge
      immunity, and every item PLAYED by allies or opponents, with owner, kind, and target.
      "Esther has an idol" means it is held and gives nobody protection. "Esther plays
      her idol on John" protects JOHN, not Esther. Ask for the recipient if unstated;
      never turn ownership into a play. Explicitly ask whether any other items are
      played if the scenario does not say; "no other plays" closes that question.
      Set council.idol_protected to [] and list all played idols in plays. An extra vote
      adds a ballot; a vote block removes a target's ordinary initial ballot. These
      effects apply regardless of the owner's alliance. Held items need no inventory
      for this task. Use perspective for the user's named alliance member, or null
      if unidentified; do not ask their identity unless a personal answer is needed.
      Ask only for missing essential facts or explicit tie rules, preserving facts
      already supplied. Never invent ballots, plays, revotes, or a rock-draw order.
      Once complete, CALL THIS TASK instead of calculating an unverified answer in chat.
      State outcomes as "Under these assumed votes and plays, ...". A valid result
      certifies the calculation, not the likelihood of these assumptions or the chat's
      prose interpretation. Do not search for alternative plays unless requested.
    runner: tool
    tools: [evaluate_scenario]
    reference: null
    instructions: >-
      Apply only the listed plays to the fixed ordinary ballots. Each item is used
      once; idol ownership and protected recipient are different fields. Blocks remove
      ordinary initial ballots, including those of immune voters, but not added extra
      ballots. Extra votes and blocks affect the initial round only; supplied revotes
      follow the declared council rules. Idol protection lasts through revotes and rocks.
      Return the interpreted scenario, full outcome, personal outcome when specified,
      protected recipients, blocked voters, and extra ballots. A correct result where
      the user or an ally goes home must pass verification just like a safe result.
  alliance-survival:
    description: >-
      Legacy ordinary-ballot calculation; prefer scenario-outcome for chat questions
      about a specified council and actual assumed item plays. Does every alliance
      member survive these assumed votes? Convert the user's plain-language
      scenario into the typed council input; expand grouped votes and preserve names.
      Ask for any missing roster, alliance, ballots, immunity, or tie rules. Never
      invent ballots or a tie priority. The user does not need to write JSON.
    runner: tool
    tools: [resolve_vote]
    reference: null
    instructions: >-
      Resolve the council under the README's explicit rules. Return the eliminated
      contestant, complete counted tallies, nullified vote count, resolution method,
      deciding candidates, and remaining alliance. Survival means every alliance
      member remains. Reject inconsistent scenarios rather than inventing missing votes.
  single-vote-rescue:
    description: >-
      Only when the user explicitly asks to compare changed votes: can one alliance
      member changing their assumed initial vote save the entire alliance?
      Convert the user's plain-language scenario into council facts; expand grouped
      votes. Ask for missing ballots, immunity, and an explicit priority tie order;
      never invent these. This search requires tie_rule priority and no revotes.
      Return the exhaustive search and show the interpreted council for the user to check.
    runner: tool
    tools: [find_rescue]
    reference: null
    instructions: >-
      Resolve the baseline. If the alliance already survives, report already_safe
      with zero changes tested. Otherwise try every legal initial-vote change by
      exactly one alliance member, holding all other facts fixed. Ties use the
      explicit priority order. Count all saving changes and return the first five
      in roster voter/target order, including each complete outcome. Never claim
      a multi-vote rescue or a rescue requiring different immunity or tie rules.
  advantage-planner:
    description: >-
      Only when the user explicitly requests alternative item plays or asks whether
      to spend an item: do we need to play an idol or advantage under these assumed votes?
      For a fixed list of plays and "who goes home?", use scenario-outcome instead.
      Extract known intended ordinary ballots and up to three usable alliance-owned
      items from ordinary chat. Held idols belong in inventory; only already-played
      idols go in council.idol_protected. Ask for missing facts, inventory, or tie
      priority. Use priority ties and no revotes. Compare no play, all singles, and
      all pairs. Honor stated target restrictions; otherwise idols may target anyone,
      extra votes any legal vote target, and vote blocks anyone except their owner.
      In this ruleset, idols nullify ordinary and extra votes against their recipient.
      An extra ballot survives its owner's ordinary vote being blocked; a vote block
      removes only the ordinary ballot, once. Explain these rules for informational
      questions without inventing a council or implying they cover every season.
      Describe the interpreted facts and the fewest-item saving plans; never claim
      predictions about how other people react or plans using more than two items.
    runner: tool
    tools: [plan_advantages]
    reference: null
    instructions: >-
      Hold the ordinary intended ballots fixed. A vote block removes only its target's
      original ballot, once. An extra vote adds a separate ballot from its owner even
      if the owner's original ballot is blocked. Idols protect a recipient from all
      counted ballots, including extra votes. Items are single-use and at most two
      distinct items may be played per candidate plan. Compare every legal plan;
      minimize item count, not assumed future strategic value. Return all single-play
      summaries and the first five minimum-item saving plans with full outcomes.
      Explain that no_saving_plan applies only to this declared two-item search.
