_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "What will happen at tribal council given a certain set of assumptions"
summary: >-
  Describe a hypothetical council in chat, assuming you know every vote and which
  idols and advantages are played. Correctly calculate who goes home in a given scenario.
highlights:
  - "Explain assumed votes and explicit item plays in ordinary language."
  - "Distinguish owning an idol from playing it on a particular recipient."
  - "See who leaves, whether you survive, and whether your whole alliance stays."
  - "Check the interpreted assumptions and independently verified vote totals."
steps:
  - "Describe the roster, alliance, assumed votes, immunity, and any played items."
  - "List every idol, extra vote, and vote block being played, or say there are none."
  - "Read the calculated outcome or pending revote/rocks/fire stage; check the interpreted facts."
