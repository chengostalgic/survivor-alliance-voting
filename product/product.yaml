_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Play the idol, use a vote advantage, or keep your items?"
summary: >-
  Describe the known votes and your available advantages in chat. Compare doing
  nothing, playing idols, adding votes, and blocking votes. Find which plays save
  the whole alliance and how many items they cost, with verified vote outcomes.
highlights:
  - "Explain the council and available items in ordinary language."
  - "Compare idols, extra votes, vote blocks, and keeping your items."
  - "Find plans using the fewest items, or explore a single changed vote."
  - "Inspect the interpreted facts, before/after tallies, and verified outcomes."
steps:
  - "Describe your cast, alliance, intended votes, immunity, and tie rules."
  - "List your usable items and ask whether anything needs to be played."
  - "Compare the baseline and alternatives, including who leaves after each play."
