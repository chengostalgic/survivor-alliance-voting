_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Find out whether your whole alliance survives tribal council."
summary: >-
  Supply a cast, alliance, ballots, immunity, and a tie policy. Survivor Alliance
  resolves one Survivor-style council and checks the outcome against every vote.
highlights:
  - "See counted votes and ballots nullified by idols."
  - "Resolve revotes and rock deadlocks with an explicit priority order."
  - "Know exactly who leaves and which alliance members remain."
steps:
  - "Provide the contestants, alliance members, and one ballot per contestant."
  - "Declare immunity, a tie policy, priority order, and any required revote ballots."
  - "Read the eliminated contestant, vote totals, and verified alliance result."
